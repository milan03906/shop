<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cart</title>
  <link rel="stylesheet" href="cart.css" />
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div>
        <h1>Korpa</h1>
        <div class="pill" id="meta">—</div>
      </div>
      <button class="btn" id="closeBtn" type="button">Zatvori</button>
    </div>

    <div id="list"></div>

    <div class="footer">
      <div class="totals">
        <span>Subtotal</span>
        <strong id="subtotal">0</strong>
      </div>
      <div class="row">
        <button class="btn danger" id="clearBtn" type="button">Clear</button>
        <button class="btn primary" id="checkoutBtn" type="button">Checkout</button>
      </div>
      <!-- <div class="note">Checkout je demo (poseban checkout.html).</div> -->
    </div>
  </div>

  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="cart.js"></script>
</body>
</html>
